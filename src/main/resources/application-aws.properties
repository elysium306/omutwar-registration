spring.datasource.url=jdbc:postgresql://<rds-endpoint>:5432/registration
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

app.bootstrap-superuser.email=bootstrap@system.local
app.bootstrap-superuser.password=${BOOTSTRAP_SUPERUSER_PASSWORD}
app.default-user-password=${DEFAULT_USER_PASSWORD}
